<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Uyut</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Uyut</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="listings.html">Listings</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="profile-section">
                <div class="profile-header">
                    <img src="https://via.placeholder.com/150" alt="Profile Picture" id="profile-avatar">
                    <h2 id="profile-name">User Name</h2>
                    <p id="profile-email">user@example.com</p>
                </div>
                <form id="profile-form">
                    <div class="form-group">
                        <label for="edit-name">Full Name</label>
                        <input type="text" id="edit-name" value="User Name">
                    </div>
                    <div class="form-group">
                        <label for="edit-email">Email</label>
                        <input type="email" id="edit-email" value="user@example.com">
                    </div>
                    <div class="form-group">
                        <label for="edit-phone">Phone Number</label>
                        <input type="tel" id="edit-phone" value="+7 (777) 12-34-56">
                    </div>
                    <div class="form-group">
                        <label for="edit-password">New Password</label>
                        <input type="password" id="edit-password" placeholder="Leave blank to keep current password">
                    </div>
                    <div class="form-group">
                        <label for="edit-password-confirm">Confirm New Password</label>
                        <input type="password" id="edit-password-confirm" placeholder="Confirm new password">
                    </div>
                    <button type="submit">Save Changes</button>
                </form>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2026 Uyut. All rights reserved.</p>
        </div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
