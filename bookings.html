<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Uyut</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Uyut</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="listings.html">Listings</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="bookings.html">Bookings</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            <h2>My Bookings</h2>
            <div class="bookings-tabs">
                <button class="tab-btn active" data-tab="active">Active Bookings</button>
                <button class="tab-btn" data-tab="past">Past Bookings</button>
            </div>
            <div class="tab-content">
                <div class="tab active" id="active-bookings">
                    <div class="bookings-list">
                        <!-- Active bookings will be inserted here -->
                        <div class="empty-state">
                            <p>No active bookings</p>
                        </div>
                    </div>
                </div>
                <div class="tab" id="past-bookings">
                    <div class="bookings-list">
                        <!-- Past bookings will be inserted here -->
                        <div class="empty-state">
                            <p>No past bookings</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2026 Uyut. All rights reserved.</p>
        </div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
