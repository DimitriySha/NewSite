<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Uyut</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Uyut</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="listings.html">Listings</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="messages.html">Messages</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            <h2>Messages</h2>
            <div class="messages-container">
                <div class="messages-list">
                    <!-- Messages will be inserted here -->
                    <div class="empty-state">
                        <p>No messages yet</p>
                    </div>
                </div>
                <div class="message-form-container">
                    <form id="message-form" class="message-form">
                        <input type="text" id="message-recipient" placeholder="Recipient" readonly>
                        <textarea id="message-content" placeholder="Type your message..." rows="4" required></textarea>
                        <button type="submit">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2026 Uyut. All rights reserved.</p>
        </div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
