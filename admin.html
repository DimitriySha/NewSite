<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Uyut</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Uyut Admin</h1>
            <nav>
                <ul>
                    <li><a href="admin.html">Dashboard</a></li>
                    <li><a href="admin-listings.html">Listings</a></li>
                    <li><a href="admin-bookings.html">Bookings</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            <h2>Admin Dashboard</h2>
            <div class="dashboard">
                <div class="dashboard-card">
                    <h3>Total Apartments</h3>
                    <div class="value" id="total-apartments">0</div>
                </div>
                <div class="dashboard-card">
                    <h3>Total Bookings</h3>
                    <div class="value" id="total-bookings">0</div>
                </div>
                <div class="dashboard-card">
                    <h3>Total Users</h3>
                    <div class="value" id="total-users">0</div>
                </div>
                <div class="dashboard-card">
                    <h3>Total Revenue</h3>
                    <div class="value" id="total-revenue">0 ₸</div>
                </div>
            </div>
            <div class="actions">
                <h3>Quick Actions</h3>
                <div class="action-buttons">
                    <button class="btn-primary" onclick="location.href='admin-listings.html'">Manage Listings</button>
                    <button class="btn-primary" onclick="location.href='admin-bookings.html'">Manage Bookings</button>
                    <button class="btn-primary" id="add-apartment-btn">Add New Apartment</button>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2026 Uyut. All rights reserved.</p>
        </div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
