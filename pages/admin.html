<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление квартирами | Агентство «Уют»</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="logo">УЮТ</div>
        <nav>
            <ul>
                <li><a href="../index.html">← На сайт</a></li>
                <li><span class="badge">Админ панель</span></li>
            </ul>
        </nav>
    </header>

    <main class="admin-main">
        <div class="admin-container">
            <div class="admin-header">
                <h1>Управление объектами</h1>
                <button class="btn btn-primary" onclick="openModal()">+ Добавить квартиру</button>
            </div>

            <!-- Filters -->
            <div class="admin-filters">
                <input type="text" id="search-input" placeholder="Поиск по названию или адресу..." oninput="filterApartments()">
                <select id="sort-select" onchange="sortApartments()">
                    <option value="newest">Сначала новые</option>
                    <option value="oldest">Сначала старые</option>
                    <option value="price-asc">Цена: по возрастанию</option>
                    <option value="price-desc">Цена: по убыванию</option>
                </select>
            </div>

            <!-- Apartments Table -->
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Фото</th>
                            <th>Название</th>
                            <th>Адрес</th>
                            <th>Цена</th>
                            <th>Гостей</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="apartments-tbody">
                        <!-- Data loads via JS -->
                    </tbody>
                </table>
            </div>

            <div id="no-data" class="no-data" style="display: none;">
                <p>Квартиры не найдены</p>
            </div>
        </div>
    </main>

    <!-- Modal for Add/Edit -->
    <div class="modal" id="apartment-modal">
        <div class="modal-content modal-lg">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Добавить квартиру</h2>
            <form id="apartment-form" onsubmit="handleSubmit(event)">
                <input type="hidden" id="apartment-id">

                <div class="form-group">
                    <label for="title">Название *</label>
                    <input type="text" id="title" required placeholder="Например: Студия в центре">
                </div>

                <div class="form-group">
                    <label for="address">Адрес *</label>
                    <input type="text" id="address" required placeholder="г. Астана, ул. Пример, 10">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="price">Цена за сутки (₸) *</label>
                        <input type="number" id="price" required min="0" placeholder="15000">
                    </div>
                    <div class="form-group">
                        <label for="guests">Вместимость (чел.)</label>
                        <input type="number" id="guests" min="1" value="2">
                    </div>
                </div>

                <div class="form-group">
                    <label for="image">URL изображения</label>
                    <input type="url" id="image" placeholder="https://example.com/image.jpg">
                    <small>Вставьте ссылку на изображение (необязательно)</small>
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" rows="4" placeholder="Опишите квартиру, удобства, особенности..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="delete-modal">
        <div class="modal-content">
            <h2>Подтвердите удаление</h2>
            <p>Вы уверены, что хотите удалить эту квартиру?</p>
            <p class="text-muted" id="delete-item-name"></p>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeDeleteModal()">Отмена</button>
                <button class="btn btn-danger" onclick="confirmDelete()">Удалить</button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
