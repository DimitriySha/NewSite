<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Агентство «Уют»</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="logo">УЮТ</div>
        <nav>
            <ul><li><a href="../index.html">← Вернуться на главную</a></li></ul>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-header">
            <h2>Создать аккаунт</h2>
            <p>Для управления бронированиями и быстрого доступа</p>
        </div>

        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Ваше имя (ФИО)</label>
                <input type="text" name="full_name" placeholder="Иванов Иван Иванович" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="example@mail.ru" required>
            </div>
            <div class="form-group">
                <label>Номер телефона</label>
                <input type="tel" name="phone" placeholder="+7 (xxx) xxx-xx-xx" required>
            </div>
            <div class="form-group">
                <label>Придумайте пароль</label>
                <input type="password" name="password" placeholder="Минимум 6 символов" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
        </form>

        <div id="register-result"></div>

        <div class="auth-footer">
            <p>Уже есть аккаунт? <a href="../index.html">Войти</a></p>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
