<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartments - Uyut</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Uyut</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="listings.html">Listings</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="search-filters">
            <div class="container">
                <form id="filter-form">
                    <div class="filter-group">
                        <label for="city">City</label>
                        <input type="text" id="city" value="Astana">
                    </div>
                    <div class="filter-group">
                        <label for="checkin">Check-in</label>
                        <input type="date" id="checkin">
                    </div>
                    <div class="filter-group">
                        <label for="checkout">Check-out</label>
                        <input type="date" id="checkout">
                    </div>
                    <div class="filter-group">
                        <label for="guests">Guests</label>
                        <input type="number" id="guests" min="1" value="1">
                    </div>
                    <button type="submit" class="btn-primary">Apply Filters</button>
                </form>
            </div>
        </section>
        <section class="sort-options">
            <div class="container">
                <label for="sort">Sort by:</label>
                <select id="sort">
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="popularity">Popularity</option>
                    <option value="rating">Rating</option>
                </select>
            </div>
        </section>
        <section class="listings" id="listings-container">
            <div class="container">
                <!-- Listings will be dynamically inserted here by JavaScript -->
                <div class="loading">Loading apartments...</div>
            </div>
        </section>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2026 Uyut. All rights reserved.</p>
        </div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
